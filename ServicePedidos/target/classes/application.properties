spring.application.name=ServicePedidos
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/pedidodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

services.carrito.url=http://localhost:8082
services.inventario.url=http://localhost:8084
services.despacho.url=http://localhost:8085
services.pago.url=http://localhost:8087
